<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch — Sharky Movies 2</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="favicon.ico" />
  <meta name="theme-color" content="#e50914" />
  <!-- TV remote / D-pad navigation. Loaded early so page
       scripts can read window.SharkyTV when building URLs. -->
  <script src="tvnav.js"></script>
  <script src="player.js" defer></script>
</head>
<body class="player-page">

  <header class="player-header">
    <a href="/" class="logo">SHARKY</a>
    <a href="/" class="player-home-link">&larr; Browse</a>
  </header>

  <section class="watch-hero">
    <div class="watch-hero-bg" id="watchBg"></div>
    <div class="watch-hero-overlay"></div>
  </section>

  <main class="watch-layout">

    <section class="sharky-player-section">
      <div class="sharky-player-wrap">
        <div class="sharky-player-loading" id="sharkyLoading">
          <div class="spinner"></div>
          <div class="loading-text">Loading Stream</div>
        </div>
        <iframe id="sharkyFrame"
          allowfullscreen mozallowfullscreen webkitallowfullscreen
          allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="sharky-attr">
        <span class="sharky-attr-dot"></span>
        Powered by <strong>Sharky Player</strong><span class="sharky-attr-sep">&nbsp;·&nbsp;</span><a href="https://sharky-movies-api.onrender.com" target="_blank" rel="noopener">sharky-movies-api.onrender.com</a>
      </div>
    </section>

    <section class="watch-top">
      <div class="watch-meta">
        <h1 id="title">Loading&hellip;</h1>
        <div class="watch-info-line" id="infoLine">
          <span>Movie</span><span>HD</span>
        </div>

        <div class="watch-actions">
          <button class="watch-action-btn primary" id="playBtn"><span class="ic">&#9654;</span> Play</button>
          <button class="watch-action-btn" id="downloadBtn"><span class="ic">&#x2913;</span> <span id="downloadLabel">Download</span></button>
          <button class="watch-action-btn" id="gwBtn"><span class="ic">&#9749;</span> Group Watch</button>
          <span class="download-status" id="downloadStatus">
            <span id="downloadStatusText">Downloading…</span>
            <span class="download-bar"><span class="download-bar-fill" id="downloadBarFill"></span></span>
          </span>
        </div>

        <p id="desc" class="watch-desc"></p>
        <p class="details-extra" id="genres"></p>
      </div>
      <aside class="watch-side" id="sidePanel">
        <div class="side-title">Details</div>
      </aside>
    </section>

    <!-- Group Watch side panel -->
    <aside class="gw-panel" id="gwPanel">
      <div class="gw-head">
        <div class="gw-title">Group Watch<small>Chat & Presence</small></div>
        <button class="gw-close" id="gwClose" aria-label="Close">&times;</button>
      </div>
      <div class="gw-code">
        <span>Room <b class="code" id="gwCode">—</b></span>
        <button id="gwCopy">Copy Link</button>
      </div>
      <div class="gw-presence" id="gwPresence"></div>
      <div class="gw-chat" id="gwChat"></div>
      <div class="gw-input">
        <input id="gwInput" type="text" placeholder="Say something…" maxlength="240">
        <button id="gwSend">Send</button>
      </div>
    </aside>

    <section class="movie-section" id="relatedSection" style="padding:0">
      <div class="section-header">
        <h2>More Like This</h2>
      </div>
      <div class="row-viewport">
        <button class="row-arrow left" aria-label="Scroll left">&#10094;</button>
        <div class="movie-row" id="relatedRow"></div>
        <button class="row-arrow right" aria-label="Scroll right">&#10095;</button>
      </div>
    </section>
  </main>

  <footer class="player-footer">
    &copy; 2026 Sharky Movies 2 &nbsp;·&nbsp;
    Content indexed via <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. All streams sourced from third-party providers.
  </footer>

  <script src="downloads.js"></script>
  <script src="groupwatch.js"></script>
  <script>
    const SHARKY_API = 'https://sharky-movies-api.onrender.com';
    const API_KEY    = '47745852f22c21e3362f4907231538e1';
    const POSTER_URL = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';
    const IMG_URL    = 'https://image.tmdb.org/t/p/w780';

    const params  = new URLSearchParams(location.search);
    const movieId = params.get('id');

    const sharkyFrame   = document.getElementById('sharkyFrame');
    const sharkyLoading = document.getElementById('sharkyLoading');
    const watchBg       = document.getElementById('watchBg');
    const titleEl       = document.getElementById('title');
    const descEl        = document.getElementById('desc');
    const infoLine      = document.getElementById('infoLine');
    const genresEl      = document.getElementById('genres');
    const sidePanel     = document.getElementById('sidePanel');
    const relatedRow    = document.getElementById('relatedRow');

    // ── Player ────────────────────────────────────────────
    /* Playing takes over the whole screen rather than sitting in a panel, so
       the page loads as a title page and waits to be asked. */
    const currentPlayUrl = movieId
      ? `${SHARKY_API}/embed/movie/${movieId}` + (window.SharkyTV && window.SharkyTV.active ? '?tv=1' : '')
      : '';
    const playBtn = document.getElementById('playBtn');
    if (playBtn) playBtn.addEventListener('click', () => {
      if (currentPlayUrl && window.SharkyPlayer) window.SharkyPlayer.open(currentPlayUrl);
    });
    if (!movieId && sharkyLoading) {
      sharkyLoading.innerHTML = '<p style="color:#888;padding:20px">No movie selected.</p>';
    }

    // ── Row arrows (same pattern as index) ────────────────
    document.querySelectorAll('.row-viewport').forEach(vp => {
      const row = vp.querySelector('.movie-row');
      vp.querySelector('.row-arrow.left')?.addEventListener('click',
        () => row.scrollBy({ left: -row.clientWidth * .8, behavior: 'smooth' }));
      vp.querySelector('.row-arrow.right')?.addEventListener('click',
        () => row.scrollBy({ left:  row.clientWidth * .8, behavior: 'smooth' }));
    });

    function esc(v){ return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }

    let currentShow = null;

    // ── Details ───────────────────────────────────────────
    async function loadMovieDetails() {
      if (!movieId) { titleEl.textContent = 'No movie selected.'; return; }
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${API_KEY}&append_to_response=credits,recommendations&language=en-US`);
        const m = await res.json();
        currentShow = m;

        const year    = m.release_date ? m.release_date.slice(0,4) : '';
        const rating  = m.vote_average ? Number(m.vote_average).toFixed(1) : '';
        const runtime = m.runtime ? `${Math.floor(m.runtime/60)}h ${m.runtime%60}m` : '';

        document.title  = `${m.title || 'Movie'} — Sharky Movies 2`;
        titleEl.textContent = m.title || 'Untitled';
        descEl.textContent  = m.overview || 'No overview available.';

        if (m.backdrop_path) watchBg.style.backgroundImage = `url("${BACKDROP_URL}${m.backdrop_path}")`;

        infoLine.innerHTML = `
          ${rating ? `<span class="rating">&#9733; ${rating}</span>` : ''}
          ${year   ? `<span>${year}</span>` : ''}
          <span>Movie</span>
          <span>HD</span>
          ${runtime ? `<span>${runtime}</span>` : ''}
        `;

        if (m.genres?.length) genresEl.textContent = m.genres.slice(0,4).map(g=>g.name).join(' · ');

        // Side panel
        const cast = (m.credits?.cast || []).slice(0,4).map(c=>c.name).join(', ');
        const dir  = (m.credits?.crew || []).filter(c=>c.job==='Director').map(c=>c.name).join(', ');
        const country = (m.production_countries || [])[0]?.name || '';
        const genresStr = (m.genres || []).slice(0,4).map(g=>g.name).join(', ');
        sidePanel.innerHTML = `
          <div class="side-title">Details</div>
          ${dir     ? `<div class="side-row"><b>Director</b><span>${esc(dir)}</span></div>` : ''}
          ${cast    ? `<div class="side-row"><b>Cast</b><span>${esc(cast)}</span></div>` : ''}
          ${genresStr ? `<div class="side-row"><b>Genres</b><span>${esc(genresStr)}</span></div>` : ''}
          ${country ? `<div class="side-row"><b>Origin</b><span>${esc(country)}</span></div>` : ''}
          ${year    ? `<div class="side-row"><b>Year</b><span>${year}</span></div>` : ''}
        `;

        // Related row
        const recs = (m.recommendations?.results || []).filter(r => r.backdrop_path || r.poster_path).slice(0,18);
        relatedRow.innerHTML = '';
        if (!recs.length) {
          document.getElementById('relatedSection').style.display = 'none';
        } else {
          recs.forEach(r => {
            const card = document.createElement('article');
            card.className = 'movie-card';
            const img = r.backdrop_path ? IMG_URL + r.backdrop_path : POSTER_URL + r.poster_path;
            const yr  = (r.release_date || '').slice(0,4);
            const rt  = r.vote_average ? Number(r.vote_average).toFixed(1) : '';
            card.innerHTML = `
              <img src="${img}" alt="${esc(r.title)}" loading="lazy">
              <div class="card-overlay">
                <h3 class="card-title">${esc(r.title || 'Untitled')}</h3>
                <div class="card-actions"><button class="card-ic play" data-act="play">&#9654;</button></div>
                <div class="card-meta">
                  ${rt ? `<span class="card-rating">&#9733; ${rt}</span>` : ''}
                  ${yr ? `<span>${yr}</span>` : ''}
                  <span class="card-badge">FILM</span>
                </div>
              </div>`;
            card.addEventListener('click', () => location.href = `movie.html?id=${r.id}`);
            relatedRow.appendChild(card);
          });
        }

        saveContinueWatching(m);
      } catch (err) {
        console.error(err);
        titleEl.textContent = 'Failed to load movie.';
      }
    }

    function saveContinueWatching(movie) {
      const key = 'sharky_movies_2_continue_watching';
      let list = [];
      try { list = JSON.parse(localStorage.getItem(key)) || []; } catch {}
      const item = {
        id: movie.id, media_type: 'movie',
        sharky_title: movie.title, sharky_date: movie.release_date || '',
        poster_path: movie.poster_path, backdrop_path: movie.backdrop_path,
        vote_average: movie.vote_average, overview: movie.overview,
        lastWatched: Date.now()
      };
      const filtered = list.filter(x => !(Number(x.id) === Number(movie.id) && x.media_type === 'movie'));
      localStorage.setItem(key, JSON.stringify([item, ...filtered].slice(0, 20)));
    }

    loadMovieDetails();

    // ── Download ──────────────────────────────────────────
    const downloadBtn   = document.getElementById('downloadBtn');
    const downloadLabel = document.getElementById('downloadLabel');
    const downloadStatus= document.getElementById('downloadStatus');
    const downloadFill  = document.getElementById('downloadBarFill');
    const downloadText  = document.getElementById('downloadStatusText');

    async function refreshDownloadBtn() {
      if (!window.SharkyDownloads || !movieId) return;
      const stub = { id: movieId, media_type: 'movie' };
      const on = await window.SharkyDownloads.isDownloaded(stub);
      downloadLabel.textContent = on ? 'Remove Download' : 'Download';
      downloadBtn.classList.toggle('primary', !on);
    }
    refreshDownloadBtn();

    downloadBtn?.addEventListener('click', async () => {
      if (!movieId) return;
      const meta = { id: movieId, media_type: 'movie', sharky_title: (currentShow?.title || document.title.split(' — ')[0]) };
      if (await window.SharkyDownloads.isDownloaded(meta)) {
        await window.SharkyDownloads.deleteDownload(meta);
        refreshDownloadBtn();
        return;
      }
      // Enrich with what we've already loaded
      const item = Object.assign({}, currentShow || {}, meta);
      item.sharky_title = item.title || item.sharky_title;
      item.sharky_date  = item.release_date || item.sharky_date || '';
      downloadBtn.disabled = true;
      downloadStatus.classList.add('on');
      downloadFill.style.width = '0%';
      try {
        await window.SharkyDownloads.startDownload(item, (p) => {
          if (p.phase === 'connecting') downloadText.textContent = 'Connecting…';
          if (p.phase === 'downloading') {
            downloadText.textContent = p.pct != null
              ? `${p.pct}%`
              : `${(p.received/1024/1024).toFixed(1)} MB`;
            if (p.pct != null) downloadFill.style.width = p.pct + '%';
          }
          if (p.phase === 'done') {
            downloadText.textContent = 'Saved offline ✓';
            downloadFill.style.width = '100%';
          }
        });
      } catch (err) {
        downloadText.textContent = 'Failed: ' + err.message;
        console.error(err);
      } finally {
        downloadBtn.disabled = false;
        refreshDownloadBtn();
        setTimeout(() => downloadStatus.classList.remove('on'), 3000);
      }
    });

    // ── Group Watch ───────────────────────────────────────
    const gwPanel = document.getElementById('gwPanel');
    const gwBtn   = document.getElementById('gwBtn');
    const gwClose = document.getElementById('gwClose');
    const gwCodeEl= document.getElementById('gwCode');
    const gwCopy  = document.getElementById('gwCopy');
    const gwChat  = document.getElementById('gwChat');
    const gwInput = document.getElementById('gwInput');
    const gwSend  = document.getElementById('gwSend');
    const gwPresenceEl = document.getElementById('gwPresence');
    let room = null;
    const participants = new Map();

    function addChatLine(html, cls) {
      const div = document.createElement('div');
      div.className = 'gw-msg' + (cls ? ' ' + cls : '');
      div.innerHTML = html;
      gwChat.appendChild(div);
      gwChat.scrollTop = gwChat.scrollHeight;
    }
    function refreshPresence() {
      gwPresenceEl.innerHTML = [...participants.values()]
        .map(u => `<span class="pill">${esc(u)}</span>`).join('');
    }

    function openRoom(code) {
      room = window.GroupWatch.joinRoom(code);
      gwCodeEl.textContent = code;
      gwPanel.classList.add('on');
      gwChat.innerHTML = '';
      participants.clear();
      participants.set(room.selfId, room.self + ' (you)');
      refreshPresence();
      addChatLine(`Joined room <b style="color:var(--red);display:inline">${code}</b> as ${esc(room.self)}. Share the link so friends can join.`, 'system');
      room.on('hello', () => {});
      room.on('presence', (m) => {
        if (m.action === 'join') { participants.set(m.from, m.user); addChatLine(`${esc(m.user)} joined.`, 'system'); }
        if (m.action === 'leave') { participants.delete(m.from); addChatLine(`${esc(m.user)} left.`, 'system'); }
        refreshPresence();
      });
      room.on('chat', (m) => addChatLine(`<b>${esc(m.user)}</b>${esc(m.text)}`));
      room.connect();
      history.replaceState(null, '', `?id=${movieId}&room=${code}`);
    }

    gwBtn?.addEventListener('click', () => {
      if (room) { gwPanel.classList.toggle('on'); return; }
      const existing = new URLSearchParams(location.search).get('room');
      const code = existing || window.GroupWatch.createCode();
      openRoom(code);
    });
    gwClose?.addEventListener('click', () => gwPanel.classList.remove('on'));
    gwCopy?.addEventListener('click', () => {
      const url = `${location.origin}${location.pathname}?id=${movieId}&room=${gwCodeEl.textContent}`;
      navigator.clipboard?.writeText(url);
      gwCopy.textContent = 'Copied!';
      setTimeout(() => gwCopy.textContent = 'Copy Link', 1200);
    });
    function sendChat() {
      const t = gwInput.value.trim();
      if (!t || !room) return;
      addChatLine(`<b>${esc(room.self)} (you)</b>${esc(t)}`);
      room.emit('chat', { text: t });
      gwInput.value = '';
    }
    gwSend?.addEventListener('click', sendChat);
    gwInput?.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
    // Auto-join if room param in URL
    if (new URLSearchParams(location.search).get('room')) {
      setTimeout(() => openRoom(new URLSearchParams(location.search).get('room')), 400);
    }
    window.addEventListener('beforeunload', () => { try { room?.close(); } catch {} });

  </script>
</body>
</html>
