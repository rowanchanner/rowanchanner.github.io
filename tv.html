<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch TV — Sharky Movies 2</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="favicon.ico" />
  <meta name="theme-color" content="#e50914" />
  <!-- TV remote / D-pad navigation. Loaded early so page
       scripts can read window.SharkyTV when building URLs. -->
  <script src="tvnav.js"></script>
  <script src="player.js" defer></script>
</head>
<body class="player-page">

  <header class="player-header">
    <a href="/" class="logo">SHARKY</a>
    <a href="/" class="player-home-link">&larr; Browse</a>
  </header>

  <section class="watch-hero">
    <div class="watch-hero-bg" id="watchBg"></div>
    <div class="watch-hero-overlay"></div>
  </section>

  <main class="watch-layout">

    <section class="sharky-player-section">
      <div class="sharky-player-wrap">
        <div class="sharky-player-loading" id="sharkyLoading">
          <div class="spinner"></div>
          <div class="loading-text">Loading Stream</div>
        </div>
        <iframe id="sharkyFrame"
          allowfullscreen mozallowfullscreen webkitallowfullscreen
          allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="sharky-attr">
        <span class="sharky-attr-dot"></span>
        Powered by <strong>Sharky Player</strong><span class="sharky-attr-sep">&nbsp;·&nbsp;</span><a href="https://sharky-movies-api.onrender.com" target="_blank" rel="noopener">sharky-movies-api.onrender.com</a>
      </div>
    </section>

    <section class="watch-top">
      <div class="watch-meta">
        <h1 id="title">Loading&hellip;</h1>
        <div class="watch-info-line" id="infoLine">
          <span>TV Series</span><span>HD</span>
        </div>

        <div class="watch-actions">
          <button class="watch-action-btn primary" id="playBtn"><span class="ic">&#9654;</span> Play</button>
          <button class="watch-action-btn" id="downloadBtn"><span class="ic">&#x2913;</span> <span id="downloadLabel">Download Episode</span></button>
          <button class="watch-action-btn" id="gwBtn"><span class="ic">&#9749;</span> Group Watch</button>
          <span class="download-status" id="downloadStatus">
            <span id="downloadStatusText">Downloading…</span>
            <span class="download-bar"><span class="download-bar-fill" id="downloadBarFill"></span></span>
          </span>
        </div>

        <p id="desc" class="watch-desc"></p>
        <p class="details-extra" id="genres"></p>
      </div>
      <aside class="watch-side" id="sidePanel">
        <div class="side-title">Details</div>
      </aside>
    </section>

    <aside class="gw-panel" id="gwPanel">
      <div class="gw-head">
        <div class="gw-title">Group Watch<small>Chat & Presence</small></div>
        <button class="gw-close" id="gwClose" aria-label="Close">&times;</button>
      </div>
      <div class="gw-code">
        <span>Room <b class="code" id="gwCode">—</b></span>
        <button id="gwCopy">Copy Link</button>
      </div>
      <div class="gw-presence" id="gwPresence"></div>
      <div class="gw-chat" id="gwChat"></div>
      <div class="gw-input">
        <input id="gwInput" type="text" placeholder="Say something…" maxlength="240">
        <button id="gwSend">Send</button>
      </div>
    </aside>

    <!-- Netflix-style episode picker -->
    <section class="tv-picker">
      <div class="tv-picker-head">
        <h2>Episodes</h2>
        <select id="seasonSelect" class="tv-select"></select>
      </div>
      <div class="episode-list" id="episodeList"></div>
    </section>

  </main>

  <footer class="player-footer">
    &copy; 2026 Sharky Movies 2 &nbsp;·&nbsp;
    Content indexed via <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. All streams sourced from third-party providers.
  </footer>

  <script src="downloads.js"></script>
  <script src="groupwatch.js"></script>
  <script>
    const SHARKY_API   = 'https://sharky-movies-api.onrender.com';
    const API_KEY      = '47745852f22c21e3362f4907231538e1';
    const IMG_URL      = 'https://image.tmdb.org/t/p/w300';
    const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';

    const params    = new URLSearchParams(location.search);
    const tvId      = params.get('id');
    const urlSeason = Number(params.get('s')) || 1;
    const urlEp     = Number(params.get('e')) || 1;

    const sharkyFrame   = document.getElementById('sharkyFrame');
    const sharkyLoading = document.getElementById('sharkyLoading');
    const watchBg       = document.getElementById('watchBg');
    const titleEl       = document.getElementById('title');
    const descEl        = document.getElementById('desc');
    const infoLine      = document.getElementById('infoLine');
    const genresEl      = document.getElementById('genres');
    const sidePanel     = document.getElementById('sidePanel');
    const seasonSelect  = document.getElementById('seasonSelect');
    const episodeList   = document.getElementById('episodeList');

    const STORAGE_CONTINUE    = 'sharky_movies_2_continue_watching';
    const STORAGE_TV_PROGRESS = 'sharky_movies_2_tv_progress';
    /* Per-episode watch state, kept in the VISITOR's own browser — nothing is
       stored server-side, so this costs the site nothing and works without
       anyone signing in. Shape: { "<tvId>": { "s1e4": {at, pct} } } */
    const STORAGE_WATCHED     = 'sharky_movies_2_watched_eps';

    let currentShow     = null;
    let selectedSeason  = urlSeason;
    let selectedEpisode = urlEp;

    function esc(v){ return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'); }

    /* Set when the viewer actively chose an episode, so an ordinary page
       load doesn't start a stream nobody asked for. */
    let userPickedEpisode = false;
    let currentPlayUrl = '';

    function loadSharkyPlayer() {
      if (!tvId) return;
      currentPlayUrl = `${SHARKY_API}/embed/tv/${tvId}/${selectedSeason}/${selectedEpisode}`
                      + (window.SharkyTV && window.SharkyTV.active ? '?tv=1' : '');
      /* Opening the page no longer starts the video. Playing is an explicit
         choice that takes over the whole screen, so a deep link lands on the
         episode list rather than ambushing you with a stream. */
      if (userPickedEpisode) {
        userPickedEpisode = false;
        if (window.SharkyPlayer) window.SharkyPlayer.open(currentPlayUrl);
      }
      saveContinueWatching();
      saveTvProgress();
      updateUrl();
    }

    function updateUrl() {
      if (!tvId) return;
      history.replaceState(null, '', `tv.html?id=${tvId}&s=${selectedSeason}&e=${selectedEpisode}`);
    }

    /* ---- per-episode watch state (visitor-local) ---- */
    function epKey(s, e) { return 's' + Number(s) + 'e' + Number(e); }
    function getWatchedAll() {
      try { return JSON.parse(localStorage.getItem(STORAGE_WATCHED)) || {}; }
      catch { return {}; }
    }
    function getWatched() { return getWatchedAll()[tvId] || {}; }
    function markWatched(s, e, pct) {
      if (!tvId) return;
      const all = getWatchedAll();
      const show = all[tvId] || (all[tvId] = {});
      const k = epKey(s, e);
      const prev = show[k] || {};
      show[k] = { at: Date.now(), pct: Math.max(prev.pct || 0, Math.min(100, pct || 0)) };
      /* Don't let one visitor's history grow without bound. */
      const keys = Object.keys(all);
      if (keys.length > 60) delete all[keys[0]];
      try { localStorage.setItem(STORAGE_WATCHED, JSON.stringify(all)); } catch {}
    }

    /* Exact origin of the embedded player, for validating postMessage. */
    const PLAYER_ORIGIN = (function () {
      try { return new URL(SHARKY_API).origin; } catch (e) { return ''; }
    })();

    /* ---- messages from the player iframe ----
       The player is on another origin, so it cannot write to this site's
       storage directly. It posts its position out instead, and we record it
       here — that is what puts a real progress bar on an episode row rather
       than a flat "started" marker. */
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || typeof d !== 'object') return;
      /* Only trust messages from the player origin we embedded. Anything
         else on the page (an ad frame, an extension) can post here too. */
      if (PLAYER_ORIGIN && ev.origin !== PLAYER_ORIGIN) return;

      if (d.type === 'sharky:progress' && d.kind === 'tv' && String(d.id) === String(tvId)) {
        markWatched(d.season, d.episode, d.pct);
        const row = episodeList.querySelector('.episode-item[data-ep="' + d.episode + '"]');
        if (row && Number(d.season) === Number(selectedSeason)) {
          row.classList.add('watched');
          let bar = row.querySelector('.ep-progress');
          if (!bar && d.pct > 0) {
            bar = document.createElement('span');
            bar.className = 'ep-progress';
            bar.innerHTML = '<i></i>';
            const th = row.querySelector('.ep-thumb');
            if (th) th.appendChild(bar);
          }
          const fill = bar && bar.querySelector('i');
          if (fill) fill.style.width = Math.max(2, Math.min(100, d.pct)) + '%';
        }
      }

      if (d.type === 'sharky:next-episode' && String(d.id) === String(tvId)) {
        /* The player rolled into the next episode on its own — keep this page
           in step so the list highlight and the URL do not go stale. */
        selectedEpisode = Number(d.episode);
        selectedSeason  = Number(d.season) || selectedSeason;
        document.querySelectorAll('.episode-item').forEach(x => x.classList.remove('playing'));
        const row = episodeList.querySelector('.episode-item[data-ep="' + selectedEpisode + '"]');
        if (row) { row.classList.add('playing', 'watched'); row.scrollIntoView({block:'nearest', behavior:'smooth'}); }
        markWatched(selectedSeason, selectedEpisode, 0);
        saveTvProgress();
        saveContinueWatching();
        updateUrl();
      }

    });

    /* Closing the player means "let me out of the video", not "leave the
       show" - so the highlight goes back to the episode you were watching. */
    document.addEventListener('sharky:player-closed', () => {
      const row = episodeList.querySelector('.episode-item.playing')
               || episodeList.querySelector('.episode-item');
      if (!row) return;
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      if (window.SharkyTV && window.SharkyTV.focus) window.SharkyTV.focus(row);
    });

    const playBtn = document.getElementById('playBtn');
    if (playBtn) playBtn.addEventListener('click', () => {
      if (currentPlayUrl && window.SharkyPlayer) window.SharkyPlayer.open(currentPlayUrl);
    });

    function getStoredProgress() {
      try { return (JSON.parse(localStorage.getItem(STORAGE_TV_PROGRESS)) || {})[tvId] || null; }
      catch { return null; }
    }
    function saveTvProgress() {
      if (!tvId) return;
      let all = {};
      try { all = JSON.parse(localStorage.getItem(STORAGE_TV_PROGRESS)) || {}; } catch {}
      all[tvId] = { season: selectedSeason, episode: selectedEpisode, updatedAt: Date.now() };
      localStorage.setItem(STORAGE_TV_PROGRESS, JSON.stringify(all));
    }
    function saveContinueWatching() {
      if (!currentShow) return;
      let list = [];
      try { list = JSON.parse(localStorage.getItem(STORAGE_CONTINUE)) || []; } catch {}
      const item = {
        id: currentShow.id, media_type: 'tv',
        sharky_title: currentShow.name, sharky_date: currentShow.first_air_date || '',
        poster_path: currentShow.poster_path, backdrop_path: currentShow.backdrop_path,
        vote_average: currentShow.vote_average, overview: currentShow.overview,
        season: selectedSeason, episode: selectedEpisode, lastWatched: Date.now()
      };
      const filtered = list.filter(x => !(Number(x.id) === Number(currentShow.id) && x.media_type === 'tv'));
      localStorage.setItem(STORAGE_CONTINUE, JSON.stringify([item, ...filtered].slice(0, 20)));
    }

    /* Give still-less episode tiles the show backdrop (dimmed so it reads as
       a placeholder, not a real still). Safe to call more than once. */
    function applyBackdropFallback() {
      if (!currentShow || !currentShow.backdrop_path) return;
      const bg = `linear-gradient(rgba(8,8,12,.58),rgba(8,8,12,.58)),url("${IMG_URL}${currentShow.backdrop_path}")`;
      document.querySelectorAll('.ep-thumb.no-image').forEach(el => {
        el.classList.remove('no-image');
        el.classList.add('is-fallback');
        el.style.backgroundImage = bg;
      });
    }

    async function loadEpisodes(seasonNum, preferEp = 1) {
      episodeList.innerHTML = `<div class="episode-item" style="grid-template-columns:1fr;padding:40px;color:var(--muted);text-align:center">Loading episodes…</div>`;
      try {
        const res  = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNum}?api_key=${API_KEY}&language=en-US`);
        const data = await res.json();
        const eps  = data.episodes || [];

        const exists   = eps.some(ep => Number(ep.episode_number) === Number(preferEp));
        selectedEpisode = exists ? Number(preferEp) : Number(eps[0]?.episode_number || 1);

        episodeList.innerHTML = '';
        (eps.length ? eps : [{ episode_number: 1, name: 'Episode 1' }]).forEach(ep => {
          const li = document.createElement('div');
          li.className = 'episode-item' + (Number(ep.episode_number) === selectedEpisode ? ' playing' : '');
          li.dataset.ep = ep.episode_number;
          /* TMDB often has no still for newer or smaller shows, which left a
             black rectangle on every row. Fall back to the show backdrop
             (dimmed, so it reads as a placeholder rather than a real still),
             then to a plain gradient with the episode number. */
          const showBackdrop = currentShow && currentShow.backdrop_path;
          let thumb = '', thumbClass = '';
          if (ep.still_path) {
            thumb = `background-image:url("${IMG_URL}${ep.still_path}")`;
          } else if (showBackdrop) {
            thumb = `background-image:linear-gradient(rgba(8,8,12,.58),rgba(8,8,12,.58)),url("${IMG_URL}${showBackdrop}")`;
            thumbClass = 'is-fallback';
          } else {
            thumbClass = 'no-image';
          }

          const w = getWatched()[epKey(seasonNum, ep.episode_number)];
          const isWatched = !!w;
          const pct = w && w.pct ? Math.max(2, Math.min(100, w.pct)) : 0;
          if (isWatched) li.classList.add('watched');

          const runtime = ep.runtime ? `${ep.runtime}m` : '';
          li.innerHTML = `
            <div class="ep-num">${ep.episode_number}</div>
            <div class="ep-thumb ${thumbClass}" style="${thumb}">
              ${thumbClass ? `<span class="ep-thumb-num">${ep.episode_number}</span>` : ''}
              ${pct ? `<span class="ep-progress"><i style="width:${pct}%"></i></span>` : ''}
              ${isWatched && !pct ? '<span class="ep-tick">&#10003;</span>' : ''}
            </div>
            <div class="ep-info">
              <div class="ep-title">
                <span>${esc(ep.name || 'Untitled')}</span>
                ${runtime ? `<span class="ep-runtime">${runtime}</span>` : ''}
              </div>
              <div class="ep-desc">${esc(ep.overview || '')}</div>
            </div>
            <div class="ep-chevron">&#10095;</div>
          `;
          li.addEventListener('click', () => {
            userPickedEpisode = true;
            selectedEpisode = Number(ep.episode_number);
            document.querySelectorAll('.episode-item').forEach(x => x.classList.remove('playing'));
            li.classList.add('playing');
            li.classList.add('watched');
            markWatched(seasonNum, ep.episode_number, 0);
            saveTvProgress();
            saveContinueWatching();
            updateUrl();
            loadSharkyPlayer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          episodeList.appendChild(li);
        });

        applyBackdropFallback();
        /* Opening the page on an episode counts as starting it. */
        markWatched(seasonNum, selectedEpisode, 0);
        const cur = episodeList.querySelector('.episode-item.playing');
        if (cur) cur.classList.add('watched');

        loadSharkyPlayer();
      } catch (err) {
        episodeList.innerHTML = `<div class="episode-item" style="grid-template-columns:1fr;padding:40px;color:var(--muted);text-align:center">Failed to load episodes.</div>`;
        console.error(err);
      }
    }

    function renderSeasons(show) {
      seasonSelect.innerHTML = '';
      const seasons = (show.seasons || []).filter(s => s.season_number > 0);
      (seasons.length ? seasons : [{ season_number: 1 }]).forEach(s => {
        const o = document.createElement('option');
        o.value = s.season_number;
        o.textContent = `Season ${s.season_number}`;
        seasonSelect.appendChild(o);
      });

      if (!params.get('s')) {
        const prog = getStoredProgress();
        if (prog) { selectedSeason = Number(prog.season) || 1; selectedEpisode = Number(prog.episode) || 1; }
      }
      const valid = seasons.some(s => Number(s.season_number) === selectedSeason);
      selectedSeason = valid ? selectedSeason : Number(seasons[0]?.season_number || 1);
      seasonSelect.value = selectedSeason;

      loadEpisodes(selectedSeason, selectedEpisode);
    }

    seasonSelect.addEventListener('change', () => {
      selectedSeason  = Number(seasonSelect.value);
      selectedEpisode = 1;
      saveTvProgress();
      updateUrl();
      loadEpisodes(selectedSeason, 1);
    });

    async function loadShowDetails() {
      if (!tvId) { titleEl.textContent = 'No TV show selected.'; return; }
      try {
        const res  = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${API_KEY}&append_to_response=credits&language=en-US`);
        const show = await res.json();
        currentShow = show;
        /* Episodes may have rendered before this resolved, in which case any
           still-less rows fell back to the plain gradient. Upgrade them to the
           show backdrop now that we have it. */
        applyBackdropFallback();

        const year    = show.first_air_date ? show.first_air_date.slice(0,4) : '';
        const rating  = show.vote_average ? Number(show.vote_average).toFixed(1) : '';
        const seasons = show.number_of_seasons || 0;

        document.title      = `${show.name || 'TV Show'} — Sharky Movies 2`;
        titleEl.textContent = show.name || 'Untitled';
        descEl.textContent  = show.overview || 'No overview available.';

        if (show.backdrop_path) watchBg.style.backgroundImage = `url("${BACKDROP_URL}${show.backdrop_path}")`;

        infoLine.innerHTML = `
          ${rating ? `<span class="rating">&#9733; ${rating}</span>` : ''}
          ${year   ? `<span>${year}</span>` : ''}
          <span>TV Series</span>
          <span>HD</span>
          ${seasons ? `<span>${seasons} Season${seasons===1?'':'s'}</span>` : ''}
        `;
        if (show.genres?.length) genresEl.textContent = show.genres.slice(0,4).map(g=>g.name).join(' · ');

        const cast = (show.credits?.cast || []).slice(0,4).map(c=>c.name).join(', ');
        const creators = (show.created_by || []).map(c => c.name).join(', ');
        const country  = (show.production_countries || [])[0]?.name || '';
        const gStr = (show.genres || []).slice(0,4).map(g=>g.name).join(', ');
        sidePanel.innerHTML = `
          <div class="side-title">Details</div>
          ${creators ? `<div class="side-row"><b>Creator</b><span>${esc(creators)}</span></div>` : ''}
          ${cast     ? `<div class="side-row"><b>Cast</b><span>${esc(cast)}</span></div>` : ''}
          ${gStr     ? `<div class="side-row"><b>Genres</b><span>${esc(gStr)}</span></div>` : ''}
          ${country  ? `<div class="side-row"><b>Origin</b><span>${esc(country)}</span></div>` : ''}
          ${year     ? `<div class="side-row"><b>First Aired</b><span>${year}</span></div>` : ''}
        `;

        renderSeasons(show);
      } catch (err) {
        titleEl.textContent = 'Failed to load TV show.';
        console.error(err);
      }
    }

    loadShowDetails();

    // ── Download (per episode) ────────────────────────────
    const downloadBtn   = document.getElementById('downloadBtn');
    const downloadLabel = document.getElementById('downloadLabel');
    const downloadStatus= document.getElementById('downloadStatus');
    const downloadFill  = document.getElementById('downloadBarFill');
    const downloadText  = document.getElementById('downloadStatusText');

    async function refreshDownloadBtn() {
      if (!window.SharkyDownloads || !tvId) return;
      const stub = { id: tvId, media_type: 'tv', season: selectedSeason, episode: selectedEpisode };
      const on = await window.SharkyDownloads.isDownloaded(stub);
      downloadLabel.textContent = on
        ? `Remove S${selectedSeason}E${selectedEpisode}`
        : `Download S${selectedSeason}E${selectedEpisode}`;
      downloadBtn.classList.toggle('primary', !on);
    }

    downloadBtn?.addEventListener('click', async () => {
      if (!tvId) return;
      const meta = {
        id: tvId, media_type: 'tv',
        season: selectedSeason, episode: selectedEpisode,
        sharky_title: (currentShow?.name || 'Show') + ` S${selectedSeason}E${selectedEpisode}`,
        poster_path:  currentShow?.poster_path,
        backdrop_path:currentShow?.backdrop_path,
        vote_average: currentShow?.vote_average,
        overview:     currentShow?.overview,
      };
      if (await window.SharkyDownloads.isDownloaded(meta)) {
        await window.SharkyDownloads.deleteDownload(meta);
        refreshDownloadBtn();
        return;
      }
      downloadBtn.disabled = true;
      downloadStatus.classList.add('on');
      downloadFill.style.width = '0%';
      try {
        await window.SharkyDownloads.startDownload(meta, (p) => {
          if (p.phase === 'connecting') downloadText.textContent = 'Connecting…';
          if (p.phase === 'downloading') {
            downloadText.textContent = p.pct != null
              ? `${p.pct}%`
              : `${(p.received/1024/1024).toFixed(1)} MB`;
            if (p.pct != null) downloadFill.style.width = p.pct + '%';
          }
          if (p.phase === 'done') { downloadText.textContent = 'Saved offline ✓'; downloadFill.style.width = '100%'; }
        });
      } catch (err) {
        downloadText.textContent = 'Failed: ' + err.message;
        console.error(err);
      } finally {
        downloadBtn.disabled = false;
        refreshDownloadBtn();
        setTimeout(() => downloadStatus.classList.remove('on'), 3000);
      }
    });

    // Refresh download label when episode changes
    const _origLoadSharky = loadSharkyPlayer;
    loadSharkyPlayer = function() { _origLoadSharky(); refreshDownloadBtn(); };
    refreshDownloadBtn();

    // ── Group Watch (chat + presence) ─────────────────────
    const gwPanel = document.getElementById('gwPanel');
    const gwBtn   = document.getElementById('gwBtn');
    const gwClose = document.getElementById('gwClose');
    const gwCodeEl= document.getElementById('gwCode');
    const gwCopy  = document.getElementById('gwCopy');
    const gwChat  = document.getElementById('gwChat');
    const gwInput = document.getElementById('gwInput');
    const gwSend  = document.getElementById('gwSend');
    const gwPresenceEl = document.getElementById('gwPresence');
    let room = null;
    const participants = new Map();

    function addChatLine(html, cls) {
      const div = document.createElement('div');
      div.className = 'gw-msg' + (cls ? ' ' + cls : '');
      div.innerHTML = html;
      gwChat.appendChild(div);
      gwChat.scrollTop = gwChat.scrollHeight;
    }
    function refreshPresence() {
      gwPresenceEl.innerHTML = [...participants.values()]
        .map(u => `<span class="pill">${esc(u)}</span>`).join('');
    }

    function openRoom(code) {
      room = window.GroupWatch.joinRoom(code);
      gwCodeEl.textContent = code;
      gwPanel.classList.add('on');
      gwChat.innerHTML = '';
      participants.clear();
      participants.set(room.selfId, room.self + ' (you)');
      refreshPresence();
      addChatLine(`Joined room <b style="color:var(--red);display:inline">${code}</b>. Share the link so friends can join.`, 'system');
      room.on('presence', (m) => {
        if (m.action === 'join') { participants.set(m.from, m.user); addChatLine(`${esc(m.user)} joined.`, 'system'); }
        if (m.action === 'leave') { participants.delete(m.from); addChatLine(`${esc(m.user)} left.`, 'system'); }
        refreshPresence();
      });
      room.on('chat', (m) => addChatLine(`<b>${esc(m.user)}</b>${esc(m.text)}`));
      room.connect();
      const q = new URLSearchParams(location.search);
      q.set('room', code);
      history.replaceState(null, '', `?${q.toString()}`);
    }

    gwBtn?.addEventListener('click', () => {
      if (room) { gwPanel.classList.toggle('on'); return; }
      const existing = new URLSearchParams(location.search).get('room');
      openRoom(existing || window.GroupWatch.createCode());
    });
    gwClose?.addEventListener('click', () => gwPanel.classList.remove('on'));
    gwCopy?.addEventListener('click', () => {
      navigator.clipboard?.writeText(location.href);
      gwCopy.textContent = 'Copied!';
      setTimeout(() => gwCopy.textContent = 'Copy Link', 1200);
    });
    function sendChat() {
      const t = gwInput.value.trim();
      if (!t || !room) return;
      addChatLine(`<b>${esc(room.self)} (you)</b>${esc(t)}`);
      room.emit('chat', { text: t });
      gwInput.value = '';
    }
    gwSend?.addEventListener('click', sendChat);
    gwInput?.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
    if (new URLSearchParams(location.search).get('room')) {
      setTimeout(() => openRoom(new URLSearchParams(location.search).get('room')), 400);
    }
    window.addEventListener('beforeunload', () => { try { room?.close(); } catch {} });
  </script>
</body>
</html>
